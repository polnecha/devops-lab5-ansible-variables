---
- name: NMAP Scan
  hosts: webservers
  become: yes
  become_method: sudo
  gather_facts: no

  tasks:
    - name: Install NMAP
      ansible.builtin.apt:
        name: nmap
        state: latest
        update_cache: yes

    - name: Copy nmap targets list
      ansible.builtin.copy:
        src: ./targets.txt
        dest: ~/targets.txt
        force: yes
        mode: '0644'

    - name: Scan
      ansible.builtin.shell: "nmap -iL ~/targets.txt -p 80 -oG -"
      register: nmap_result

    - name: Nmap output
      ansible.builtin.debug:
        msg: "{{ nmap_result.stdout_lines }}"